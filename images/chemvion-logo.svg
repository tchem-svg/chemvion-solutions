    <!-- V -->
    <path d="M86,0 L90,0 L94,16 L98,0 L102,0 L96.5,21 L91.5,21 Z" fill="currentColor"/>
    <!-- I -->
    <path d="M107,0 L111,0 L111,21 L107,21 Z" fill="currentColor"/>
