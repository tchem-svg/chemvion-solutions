<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 48" fill="none">
  <!-- Chemvion Geometric Mark -->
  <!-- Inspired by Clariant: angular, bold, abstract 'C' with molecular bond suggestion -->
  <g id="chemvion-mark">
    <!-- Outer hexagonal ring (molecular structure nod) -->
    <polygon points="20,2 36,2 44,14 36,26 20,26 12,14" 
             fill="none" 
             stroke="currentColor" 
             stroke-width="2.5"/>
    
    <!-- Inner 'C' shape formed by angular cutout -->
    <polygon points="20,8 32,8 37,14 32,20 20,20 17,14" 
             fill="currentColor"/>
    
    <!-- Bond line extending from hexagon (molecular connection) -->
    <line x1="44" y1="14" x2="52" y2="14" 
          stroke="currentColor" 
          stroke-width="2.5" 
          stroke-linecap="square"/>
    
    <!-- Accent dot (nod to chemistry/periodic table) -->
    <circle cx="48" cy="14" r="2" fill="currentColor"/>
  </g>
  
  <!-- CHEMVION wordmark -->
  <g id="chemvion-wordmark" transform="translate(62, 10)">
    <!-- C -->
